name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraer ZIP del proyecto
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          unzip "$ZIP" -d temp_project
          INNER=$(ls temp_project)
          mv temp_project/$INNER/* . 2>/dev/null || mv temp_project/* .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraKey-debug
          path: app/build/outputs/apk/debug/*.apk
